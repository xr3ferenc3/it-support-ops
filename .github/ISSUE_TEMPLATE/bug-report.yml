name: Bug Report
description: Something broke or produced wrong output.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Where did this happen?
      options:
        - itops CLI (Linux/macOS)
        - ITSupportOps PowerShell module
        - A standalone script
        - Ticketing integration
        - Documentation/playbook
        - CI/build
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and version
      placeholder: "e.g. macOS 15.1 (Apple Silicon), Windows 11 23H2, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Paste the exact error/output if you have it - exact text matters more than a paraphrase.
      render: shell
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ran `itops network -t intranet.company.local`
        2. ...
    validations:
      required: true