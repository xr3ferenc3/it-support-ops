name: CI

# Runs quality checks on every push and PR so contributions are verified
# automatically instead of taken on trust. Three independent jobs, one per
# content type in this repo: docs, PowerShell scripts, Bash scripts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-markdown:
    name: Lint Markdown (docs, playbooks, templates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !.github/**

      - name: Check for broken internal links
        run: |
          set -e
          fail=0
          for f in $(find . -name "*.md" -not -path "./.git/*" -not -path "./.github/*"); do
            dir=$(dirname "$f")
            # Extract markdown-style relative links: [text](path)
            grep -oE '\]\(([^http][^)]+\.md[^)]*)\)' "$f" | sed -E 's/^\]\((.+)\)$/\1/' | while read -r link; do
              # Strip any #anchor suffix
              target="${link%%#*}"
              [ -z "$target" ] && continue
              resolved=$(realpath -m "$dir/$target" 2>/dev/null)
              if [ ! -f "$resolved" ]; then
                echo "::error file=$f::Broken link -> $link"
                fail=1
              fi
            done
          done
          exit $fail

  lint-powershell:
    name: Lint PowerShell scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./scripts/windows -Recurse -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            $errorCount = ($results | Where-Object { $_.Severity -eq 'Error' }).Count
            if ($errorCount -gt 0) {
              Write-Error "$errorCount error-level issue(s) found."
              exit 1
            }
          } else {
            Write-Host "No issues found."
          }

  lint-bash:
    name: Lint Bash scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts/linux"
          severity: warning
