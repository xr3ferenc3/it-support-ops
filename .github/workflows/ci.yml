name: CI

# Runs on every push and PR. This is the proof layer: it doesn't just check
# that the scripts *look* right, it actually executes every script on a
# clean Windows and Linux runner and fails the build if any of them error
# out. That's the difference between "trust me, it works" and a badge
# anyone can click on.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint-powershell:
    name: Lint PowerShell (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./scripts/windows -Recurse -Severity Warning,Error
          $results | Format-Table -AutoSize
          $errors = $results | Where-Object { $_.Severity -eq 'Error' }
          if ($errors.Count -gt 0) {
            Write-Host "::error::PSScriptAnalyzer found $($errors.Count) error-level issue(s)."
            exit 1
          }

  smoke-test-powershell:
    name: Execute PowerShell scripts (Windows)
    runs-on: windows-latest
    needs: lint-powershell
    strategy:
      fail-fast: false
      matrix:
        script:
          - Get-SystemHealthReport.ps1
          - Get-NetworkDiagnostics.ps1
          - Get-DiskHealthReport.ps1
          - Get-EventLogSummary.ps1
          - Test-ConnectivitySuite.ps1
    steps:
      - uses: actions/checkout@v4

      - name: Run ${{ matrix.script }} as standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "./scripts/windows/${{ matrix.script }}"
          Write-Host "Running $path ..."
          & $path
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
            throw "$path exited with code $LASTEXITCODE"
          }

      - name: Verify a report file was produced
        shell: pwsh
        run: |
          $reportDir = Join-Path $env:USERPROFILE "Documents\IT-Diagnostics"
          if (-not (Test-Path $reportDir)) {
            throw "Expected output directory was not created: $reportDir"
          }
          $files = Get-ChildItem $reportDir -Filter *.txt
          if ($files.Count -eq 0) {
            throw "No report file was written to $reportDir"
          }
          Write-Host "Report(s) found:"
          $files | ForEach-Object { Write-Host " - $($_.Name)" }

  lint-bash:
    name: Lint Bash (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on scripts/linux
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts/linux'
          severity: warning

      - name: ShellCheck itops CLI and installer
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning cli/itops install.sh

  lint-macos:
    name: Lint macOS scripts (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on scripts/macos
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts/macos'
          severity: warning

  smoke-test-bash:
    name: Execute Bash scripts (Linux)
    runs-on: ubuntu-latest
    needs: lint-bash
    strategy:
      fail-fast: false
      matrix:
        script:
          - system-health-report.sh
          - network-diagnostics.sh
          - disk-health-report.sh
          - log-summary.sh
          - connectivity-suite.sh
    steps:
      - uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x "./scripts/linux/${{ matrix.script }}"

      - name: Run ${{ matrix.script }} as standard user
        run: "./scripts/linux/${{ matrix.script }}"

  smoke-test-macos:
    name: Execute macOS scripts (macOS)
    runs-on: macos-latest
    needs: lint-macos
    strategy:
      fail-fast: false
      matrix:
        script:
          - system-health-report.sh
          - network-diagnostics.sh
          - disk-health-report.sh
          - log-summary.sh
          - connectivity-suite.sh
    steps:
      - uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x "./scripts/macos/${{ matrix.script }}"

      - name: Run ${{ matrix.script }} as standard user
        run: "./scripts/macos/${{ matrix.script }}"

  verify-module-sync:
    name: Verify module scripts match scripts/windows (single source of truth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diff scripts/windows against module/ITSupportOps/Scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Get-ChildItem "./scripts/windows" -Filter "*.ps1" | Sort-Object Name
          $bundled = Get-ChildItem "./module/ITSupportOps/Scripts" -Filter "*.ps1" | Sort-Object Name

          if ($source.Count -ne $bundled.Count) {
            Write-Host "::error::File count mismatch: scripts/windows has $($source.Count), module/ITSupportOps/Scripts has $($bundled.Count)."
            exit 1
          }

          $drift = $false
          foreach ($file in $source) {
            $counterpart = Join-Path "./module/ITSupportOps/Scripts" $file.Name
            if (-not (Test-Path $counterpart)) {
              Write-Host "::error::$($file.Name) exists in scripts/windows but not in module/ITSupportOps/Scripts."
              $drift = $true
              continue
            }
            $a = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            $b = (Get-FileHash $counterpart -Algorithm SHA256).Hash
            if ($a -ne $b) {
              Write-Host "::error::$($file.Name) differs between scripts/windows and module/ITSupportOps/Scripts. Run ./tools/Build-Module.ps1 and commit the result."
              $drift = $true
            }
          }

          if ($drift) {
            exit 1
          }
          Write-Host "module/ITSupportOps/Scripts is in sync with scripts/windows ($($source.Count) files match)."

  test-cli-linux:
    name: Execute itops CLI (simulated install)
    runs-on: ubuntu-latest
    needs: lint-bash
    steps:
      - uses: actions/checkout@v4

      - name: Simulate a real user install (no sudo, no network)
        run: |
          set -euo pipefail
          chmod +x cli/itops scripts/linux/*.sh
          mkdir -p "$HOME/.itops/scripts" "$HOME/.local/bin"
          cp scripts/linux/*.sh "$HOME/.itops/scripts/"
          cp cli/itops "$HOME/.itops/itops"
          chmod +x "$HOME/.itops/itops" "$HOME/.itops"/scripts/*.sh
          ln -sf "$HOME/.itops/itops" "$HOME/.local/bin/itops"

      - name: Run every itops command through the installed symlink
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          itops help
          itops version
          for cmd in health network disk logs connectivity; do
            echo "--- itops $cmd ---"
            itops "$cmd"
          done
          echo "--- help pass-through for each subcommand ---"
          for cmd in health network disk logs connectivity; do
            itops "$cmd" -h
          done

      - name: Verify reports were written
        run: |
          set -euo pipefail
          count=$(find "$HOME/it-diagnostics" -name '*.txt' | wc -l)
          echo "Report files found: $count"
          if [ "$count" -lt 5 ]; then
            echo "::error::Expected at least 5 report files from itops, found $count"
            exit 1
          fi

  test-cli-macos:
    name: Execute itops CLI (simulated install, macOS)
    runs-on: macos-latest
    needs: lint-macos
    steps:
      - uses: actions/checkout@v4

      - name: Simulate a real user install (no sudo, no network)
        run: |
          set -euo pipefail
          chmod +x cli/itops scripts/macos/*.sh
          mkdir -p "$HOME/.itops/scripts" "$HOME/.local/bin"
          cp scripts/macos/*.sh "$HOME/.itops/scripts/"
          cp cli/itops "$HOME/.itops/itops"
          chmod +x "$HOME/.itops/itops" "$HOME/.itops"/scripts/*.sh
          ln -sf "$HOME/.itops/itops" "$HOME/.local/bin/itops"

      - name: Run every itops command through the installed symlink
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          itops help
          itops version
          for cmd in health network disk logs connectivity; do
            echo "--- itops $cmd ---"
            itops "$cmd"
          done
          echo "--- help pass-through for each subcommand ---"
          for cmd in health network disk logs connectivity; do
            itops "$cmd" -h
          done

      - name: Verify reports were written
        run: |
          set -euo pipefail
          count=$(find "$HOME/it-diagnostics" -name '*.txt' | wc -l)
          echo "Report files found: $count"
          if [ "$count" -lt 5 ]; then
            echo "::error::Expected at least 5 report files from itops, found $count"
            exit 1
          fi

  test-module-powershell:
    name: Import and execute ITSupportOps module (Windows)
    runs-on: windows-latest
    needs: lint-powershell
    steps:
      - uses: actions/checkout@v4

      - name: Import module and verify exported commands
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module ./module/ITSupportOps -Force
          $cmds = Get-Command -Module ITSupportOps
          $cmds | Format-Table Name
          if ($cmds.Count -ne 5) {
            throw "Expected 5 exported commands from ITSupportOps, found $($cmds.Count)"
          }

      - name: Run every exported cmdlet as a standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module ./module/ITSupportOps -Force
          Get-ITSystemHealthReport
          Get-ITNetworkDiagnostics
          Get-ITDiskHealthReport
          Get-ITEventLogSummary
          Test-ITConnectivitySuite

      - name: Verify reports were written
        shell: pwsh
        run: |
          $reportDir = Join-Path $env:USERPROFILE "Documents\IT-Diagnostics"
          if (-not (Test-Path $reportDir)) {
            throw "Expected output directory was not created: $reportDir"
          }
          $files = Get-ChildItem $reportDir -Filter *.txt
          Write-Host "Report files found: $($files.Count)"
          if ($files.Count -lt 5) {
            throw "Expected at least 5 report files from the module, found $($files.Count)"
          }

  all-checks-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [smoke-test-powershell, smoke-test-bash, smoke-test-macos, verify-module-sync, test-cli-linux, test-cli-macos, test-module-powershell]
    steps:
      - run: echo "Every script (Windows, Linux, macOS), the itops CLI, and the ITSupportOps module all linted and executed successfully."